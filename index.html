<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Lễ Thành Hôn - Công Tuấn & Trúc Phương</title>
  
  <!-- Tối ưu font: Chỉ tải các weight thực sự sử dụng -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #2b2b2b;
      --accent-color: #8c6d62;
      --bg-color: #ece5dc;
      --text-color: #333333;
      --card-bg: #fdfbf9;
      --font-cursive: 'Alex Brush', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(rgba(140, 109, 98, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* MÀN HÌNH CHÀO */
    .welcome-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #fdfbf9;
      background-image: radial-gradient(rgba(207, 194, 180, 0.25) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: transform 0.7s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.7s ease;
      will-change: transform, opacity;
    }
    .welcome-overlay.fade-out {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none;
    }
    .welcome-decor {
      font-family: var(--font-cursive);
      font-size: clamp(2rem, 5vw, 2.6rem);
      color: var(--accent-color);
      margin-bottom: 8px;
    }
    .welcome-title {
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 500;
      color: #666;
      margin-bottom: 20px;
    }
    .welcome-names {
      font-family: var(--font-cursive);
      font-size: clamp(3.2rem, 8vw, 4.4rem);
      line-height: 1.15;
      color: var(--primary-color);
      margin-bottom: 35px;
    }
    .welcome-btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(140, 109, 98, 0.35);
      transition: background 0.3s, transform 0.3s;
      animation: pulse 2.2s infinite ease-in-out;
    }
    .welcome-btn:hover {
      background: var(--primary-color);
      transform: translateY(-2px);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* CONTAINER THIỆP CHÍNH */
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
      position: relative;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      body {
        padding: 40px 0;
      }
      .container {
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(60, 40, 30, 0.12);
      }
      .music-btn {
        top: 30px !important;
        right: 30px !important;
      }
    }

    /* NÚT BẬT NHẠC */
    .music-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(5px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.06);
      font-size: 18px;
      transition: transform 0.2s;
    }
    .music-btn:active {
      transform: scale(0.9);
    }
    .rotating {
      animation: spin 3.5s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* KHUNG GALLERY HÌNH ẢNH */
    .hero-gallery {
      position: relative;
      background: #111;
      width: 100%;
      overflow: hidden;
    }
    .hero-top {
      position: relative;
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }
    .hero-top img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center 5%;
      display: block;
    }
    .hero-top::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 45%, transparent 75%);
      pointer-events: none;
    }
    .overlay-text {
      position: absolute;
      bottom: 18px;
      left: 5%;
      right: 5%;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      z-index: 2;
    }
    .overlay-text .forever {
      font-family: var(--font-cursive);
      font-size: clamp(2.6rem, 7.5vw, 3.4rem);
      line-height: 1.1;
      font-weight: normal;
    }
    .overlay-text .promise {
      font-size: 0.72rem;
      letter-spacing: 4px;
      font-weight: 500;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .hero-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 6px;
      background: #151515;
    }
    .hero-bottom img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: 2px;
    }

    /* NỘI DUNG */
    .content-wrapper {
      padding: clamp(32px, 6vw, 44px) 24px 20px;
      text-align: center;
    }

    .family-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 35px;
      font-size: 0.82rem;
      line-height: 1.6;
    }
    .family-title {
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--primary-color);
    }
    .family-name {
      color: #4a4a4a;
    }
    .family-location {
      font-style: italic;
      color: #777;
      margin-top: 3px;
      font-size: 0.76rem;
    }

    .invitation-text {
      margin-bottom: 35px;
    }
    .invitation-text .label {
      font-size: 0.78rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #777;
    }
    .guest-name-box {
      font-family: var(--font-cursive);
      font-size: clamp(2.8rem, 7vw, 3.4rem);
      margin: 6px 0;
      border-bottom: 1px solid #c8b9aa;
      display: inline-block;
      padding: 0 20px 8px;
      color: var(--accent-color);
      min-width: 200px;
    }
    .invitation-desc {
      font-size: 0.82rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #555;
      margin-top: 14px;
    }

    .wedding-names-container {
      margin: 40px 0;
    }
    .wedding-names h1 {
      font-family: var(--font-cursive);
      font-size: clamp(3.8rem, 10vw, 4.6rem);
      font-weight: normal;
      color: var(--primary-color);
      line-height: 1.1;
    }

    /* ĐẾM NGƯỢC */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 35px 0;
    }
    .countdown-item {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid #e2d7cb;
      padding: 10px 6px;
      border-radius: 8px;
      flex: 1;
      max-width: 75px;
    }
    .countdown-item span {
      display: block;
      font-size: clamp(1.15rem, 3.5vw, 1.35rem);
      font-weight: 600;
      color: var(--primary-color);
    }
    .countdown-item label {
      font-size: 0.65rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* SỰ KIỆN */
    .event-details {
      margin-bottom: 35px;
    }
    .time-top {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 8px;
    }
    .main-date {
      font-size: clamp(2rem, 6vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 2.5px;
      color: var(--primary-color);
      margin-bottom: 20px;
      border-top: 1px solid #dfd3c5;
      border-bottom: 1px solid #dfd3c5;
      padding: 10px 0;
    }
    .venue-name {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--primary-color);
      line-height: 1.4;
      margin-bottom: 5px;
    }
    .venue-sub {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--accent-color);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .venue-address {
      font-size: 0.84rem;
      color: #555;
      line-height: 1.55;
    }
    .btn-map {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      padding: 10px 22px;
      background: none;
      border: 1px solid #444;
      border-radius: 4px;
      color: var(--primary-color);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .btn-map:hover {
      background: var(--primary-color);
      color: #fff;
    }

    /* TIMELINE */
    .timeline-section {
      margin: 40px 0;
    }
    .timeline-title {
      font-family: var(--font-cursive);
      font-size: clamp(3.2rem, 8vw, 3.8rem);
      margin-bottom: 22px;
      color: var(--primary-color);
    }
    .timeline-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .timeline-item {
      text-align: center;
      padding: 6px;
    }
    .timeline-icon {
      width: 38px;
      height: 38px;
      margin: 0 auto 10px;
      opacity: 0.88;
      display: block;
    }
    .timeline-time {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 4px;
    }
    .timeline-desc {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
    }

    /* FORM RSVP */
    .rsvp-section {
      background: #ffffff;
      border-top: 1px solid #e8decb;
      padding: clamp(32px, 6vw, 44px) 24px;
      margin-top: 25px;
    }
    .rsvp-section h2 {
      font-size: 1.15rem;
      color: var(--primary-color);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      margin-bottom: 6px;
      color: #555;
      font-weight: 500;
    }
    .form-group input, 
    .form-group select
