<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Lễ Thành Hôn - Trúc Phương & Công Tuấn</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #2b2b2b;
      --accent-color: #8c6d62;
      --bg-color: #ece5dc;
      --text-color: #333333;
      --card-bg: #fdfbf9;
      --font-cursive: 'Alex Brush', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(rgba(140, 109, 98, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* MÀN HÌNH CHÀO MỞ THIỆP */
    .welcome-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #fdfbf9;
      background-image: radial-gradient(rgba(207, 194, 180, 0.25) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
    }
    .welcome-overlay.fade-out {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none;
    }
    .welcome-decor {
      font-family: var(--font-cursive);
      font-size: clamp(2rem, 5vw, 2.6rem);
      color: var(--accent-color);
      margin-bottom: 8px;
    }
    .welcome-title {
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 500;
      color: #666;
      margin-bottom: 20px;
    }
    .welcome-names {
      font-family: var(--font-cursive);
      font-size: clamp(3.2rem, 8vw, 4.4rem);
      line-height: 1.15;
      color: var(--primary-color);
      margin-bottom: 35px;
    }
    .welcome-btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(140, 109, 98, 0.35);
      transition: all 0.3s ease;
      animation: pulse 2.2s infinite ease-in-out;
    }
    .welcome-btn:hover {
      background: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
